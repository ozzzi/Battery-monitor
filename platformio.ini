
[platformio]
default_envs = probe

[s2base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip  ; Arduino core 3.x
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DPYLONMON_API_VERSION=1
  -DPYLONMON_FW_VERSION=\"0.3.1\"
lib_deps =
  bblanchon/ArduinoJson@^7

[env:s2mini]
extends = s2base

[env:probe]
extends = s2base
build_flags =
  ${s2base.build_flags}
  -DPYLONMON_PROBE=1

[env:probe_ota]
extends = env:probe
upload_protocol = espota
upload_port = battery.local
upload_flags =
  --auth=${sysenv.PYLONMON_OTA_PASS}
  --port=3232
  --host_port=45678

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<console/Parser.cpp> +<model/Snapshot.cpp> +<net/WifiFsm.cpp>
build_flags =
  -std=gnu++17
  -Isrc
  -DFIXTURES_DIR=\"$PROJECT_DIR/test/fixtures\"
